<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perong Campsite — Booking &amp; Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,900&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F3ECDC;
    --paper:#FFFCF6;
    --forest:#2F5233;
    --forest-dark:#1C331F;
    --teal:#4F7C74;
    --teal-light:#E6ECE5;
    --ember:#BC6135;
    --ember-dark:#954B27;
    --ember-light:#F1E0CE;
    --gold:#C79A44;
    --gold-dark:#A67D31;
    --bark:#6E4B30;
    --ink:#2B2620;
    --ink-soft:#726A5B;
    --line:#DCD2B9;
    --danger:#AA3B2C;
    --danger-light:#F4E0D9;
    --success:#4C7A4E;
    --success-light:#E5EEE0;
    --warn:#95721E;
    --warn-light:#F1E6C6;
    --radius:14px;
    --shadow: 0 4px 16px rgba(47,82,51,0.12), 0 1px 3px rgba(47,82,51,0.08);
    --shadow-lg: 0 20px 48px rgba(47,82,51,0.22), 0 4px 14px rgba(188,97,53,0.14);
    --gradient-hero: linear-gradient(120deg, #2F5233 0%, #5C7A52 48%, #BC6135 100%);
    --gradient-warm: linear-gradient(120deg, #BC6135, #C79A44);
    --gradient-cool: linear-gradient(120deg, #2F5233, #4F7C74);
    --ease-bounce: cubic-bezier(.34,1.56,.64,1);
    --ease-smooth: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;}
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; }
  }
  html,body{margin:0;padding:0;}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Public Sans', sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:'Fraunces', serif; font-weight:700; color:var(--forest); margin:0 0 4px; letter-spacing:-0.01em;}
  a{color:var(--teal); transition:color .15s var(--ease-smooth);}
  button{font-family:inherit; cursor:pointer;}
  input, select, textarea{ font-family:inherit; font-size:14px; transition:border-color .15s var(--ease-smooth), box-shadow .15s var(--ease-smooth); }

  @keyframes fadeInUp{ from{ opacity:0; transform:translateY(14px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ from{ opacity:0;} to{ opacity:1;} }
  @keyframes popIn{ from{ opacity:0; transform:scale(.9);} to{ opacity:1; transform:scale(1);} }
  @keyframes gradientShift{ 0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;} }
  @keyframes floatY{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-10px);} }
  @keyframes pulseGlow{ 0%,100%{ box-shadow:0 0 0 0 rgba(255,122,69,.35);} 50%{ box-shadow:0 0 0 8px rgba(255,122,69,0);} }
  @keyframes shimmer{ 0%{ background-position:-200% 0;} 100%{ background-position:200% 0;} }
  @keyframes spinSlow{ from{ transform:rotate(0deg);} to{ transform:rotate(360deg);} }

  /* ---------- App shell ---------- */
  #app{ min-height:100vh; display:flex; flex-direction:column; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 22px 20px; color:#fff;
    background:linear-gradient(120deg, var(--forest), var(--teal) 55%, var(--forest-dark));
    background-size:200% 200%; animation:gradientShift 14s ease infinite;
    position:relative; z-index:5;
  }
  .topbar::after{
    content:''; position:absolute; left:0; right:0; bottom:-9px; height:16px; z-index:6;
    background:
      linear-gradient(135deg, var(--ember) 25%, transparent 25%) 0 0,
      linear-gradient(-135deg, var(--ember) 25%, transparent 25%) 0 0;
    background-size:16px 16px; background-repeat:repeat-x;
    filter:drop-shadow(0 2px 2px rgba(0,0,0,.15));
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand .mark{
    width:36px; height:36px; border-radius:50%; background:var(--gradient-warm);
    display:flex; align-items:center; justify-content:center; font-size:18px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.3), 0 4px 12px rgba(255,122,69,.4);
    transition:transform .35s var(--ease-bounce);
  }
  .brand .mark:hover{ transform:rotate(-12deg) scale(1.12); }
  .brand-text .name{ font-family:'Fraunces', serif; font-weight:700; font-size:17px; line-height:1.1; color:#fff;}
  .brand-text .tag{ font-size:11px; color:#D7F5EE; letter-spacing:.04em; text-transform:uppercase;}
  .topbar-right{ display:flex; align-items:center; gap:14px; }
  .role-pill{ background:rgba(255,255,255,0.16); border:1px solid rgba(255,255,255,0.3); color:#fff; padding:4px 12px; border-radius:20px; font-size:12px; text-transform:uppercase; letter-spacing:.05em;}
  .who{ font-size:13px; color:#EAF7F3;}
  .btn-logout{ background:transparent; border:1px solid rgba(255,255,255,0.4); color:#fff; padding:7px 14px; border-radius:8px; font-size:13px; transition:all .2s var(--ease-smooth);}
  .btn-logout:hover{ background:rgba(255,255,255,0.16); transform:translateY(-1px); }

  .shell{ flex:1; display:flex; min-height:0; }

  /* ============================================================
     SIDEBAR — "the big tree": a bark trunk runs the full height of
     the sidebar, each nav item is a leaf/lantern bud on a curved
     twig branching off the trunk. Customer = living daylight forest
     tree. Staff = a night ranger-post tree lit by hanging lanterns.
     ============================================================ */
  .sidebar{
    width:250px; flex-shrink:0; position:relative; overflow:hidden;
    padding:0 14px 20px 50px; display:flex; flex-direction:column;
    color:#EDE7D6;
  }
  .sidebar.role-customer{ background:linear-gradient(190deg, #1d4327 0%, #123120 55%, #081a10 100%); }
  .sidebar.role-staff{ background:linear-gradient(190deg, #23201c 0%, #17140f 55%, #0c0a07 100%); }

  /* the trunk: a cylindrical bark column running the sidebar height */
  .sidebar::before{
    content:''; position:absolute; top:0; left:18px; width:20px; height:100%; z-index:0;
    border-radius:11px;
    box-shadow: inset 0 0 14px rgba(0,0,0,.5), inset 3px 0 0 rgba(255,255,255,.05);
  }
  .sidebar.role-customer::before{
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.16) 0 3px, transparent 3px 10px),
      linear-gradient(90deg, #3c2c19, #6b4c2c 32%, #86642f 50%, #6b4c2c 68%, #33240f);
  }
  .sidebar.role-staff::before{
    background:
      repeating-linear-gradient(180deg, rgba(0,0,0,.22) 0 3px, transparent 3px 10px),
      linear-gradient(90deg, #221a13, #4a3a26 32%, #5c4830 50%, #4a3a26 68%, #1c150e);
  }

  /* canopy: leafy cluster (customer) or moonlit fireflies (staff) at the crown */
  .tree-canopy{ position:relative; height:78px; margin-left:-50px; margin-bottom:6px; z-index:1; flex-shrink:0; }
  .tree-canopy .leaf-blob{ position:absolute; border-radius:50%; filter:blur(.5px); }
  .role-customer .tree-canopy .leaf-blob{ background:radial-gradient(circle at 32% 32%, #6fae52, #2c5c30 75%); box-shadow:0 3px 10px rgba(0,0,0,.25);}
  .role-customer .tree-canopy .lb1{ width:64px; height:52px; top:6px; left:34px; transform:rotate(-8deg);}
  .role-customer .tree-canopy .lb2{ width:52px; height:46px; top:20px; left:78px; transform:rotate(10deg);}
  .role-customer .tree-canopy .lb3{ width:46px; height:40px; top:4px; left:110px;}
  .role-customer .tree-canopy .lb4{ width:38px; height:34px; top:34px; left:52px;}
  .role-customer .tree-canopy .berry{ position:absolute; width:7px; height:7px; border-radius:50%; background:var(--ember); box-shadow:0 0 6px rgba(255,140,60,.8);}
  .role-customer .tree-canopy .be1{ top:26px; left:60px; } .role-customer .tree-canopy .be2{ top:44px; left:96px; } .role-customer .tree-canopy .be3{ top:16px; left:126px; }

  .role-staff .tree-canopy .leaf-blob{ background:radial-gradient(circle at 30% 30%, #4a3d2c, #221a13 75%); }
  .role-staff .tree-canopy .lb1{ width:64px; height:52px; top:8px; left:34px; transform:rotate(-8deg);}
  .role-staff .tree-canopy .lb2{ width:50px; height:44px; top:22px; left:78px; transform:rotate(8deg);}
  .role-staff .tree-canopy .moon{ position:absolute; width:22px; height:22px; border-radius:50%; top:6px; left:104px; background:#F3E7C4; box-shadow:0 0 16px rgba(243,231,196,.55); }
  .role-staff .tree-canopy .firefly{ position:absolute; width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px 2px rgba(199,154,68,.85); animation:fireflyDrift 4.5s ease-in-out infinite; }
  .role-staff .tree-canopy .fl1{ top:40px; left:58px; animation-delay:0s;} .role-staff .tree-canopy .fl2{ top:20px; left:96px; animation-delay:1.2s;} .role-staff .tree-canopy .fl3{ top:52px; left:118px; animation-delay:2.4s;}
  @keyframes fireflyDrift{ 0%,100%{ transform:translate(0,0); opacity:.5;} 50%{ transform:translate(6px,-8px); opacity:1;} }

  .tree-brand{ position:relative; z-index:2; display:flex; align-items:center; gap:8px; padding:8px 0 12px; margin-left:-50px; padding-left:14px; }
  .tree-brand .mark{ width:32px; height:32px; border-radius:50%; background:var(--gradient-warm); display:flex; align-items:center; justify-content:center; font-size:15px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.3), 0 4px 10px rgba(0,0,0,.35); flex-shrink:0;}
  .tree-brand .name{ font-family:'Fraunces',serif; font-weight:700; font-size:14.5px; color:#fff; line-height:1.15;}
  .tree-brand .tag{ font-size:10px; color:#9FCBA8; text-transform:uppercase; letter-spacing:.05em;}
  .role-staff .tree-brand .tag{ color:#C7A96A; }

  /* drifting leaves / embers inside the sidebar for ambient life */
  .sidebar .drift{ position:absolute; z-index:0; pointer-events:none; opacity:.55; }
  .role-customer .sidebar .drift{ animation:leafFall 9s linear infinite; }
  .role-staff .sidebar .drift{ animation:leafFall 11s linear infinite; opacity:.35; }
  @keyframes leafFall{ 0%{ transform:translateY(-20px) translateX(0) rotate(0deg); opacity:0;} 10%{opacity:.6;} 90%{opacity:.4;} 100%{ transform:translateY(420px) translateX(24px) rotate(200deg); opacity:0;} }

  .side-section-label{
    position:relative; z-index:1; display:inline-flex; align-items:center; gap:5px;
    font-size:10px; text-transform:uppercase; letter-spacing:.08em; font-weight:700;
    color:#BFE3C6; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.09);
    padding:3px 10px 3px 8px; border-radius:20px; margin:16px 0 9px 0;
  }
  .side-section-label:first-of-type{ margin-top:2px; }
  .role-staff .side-section-label{ color:#E4CE9C; }

  .tree-branches{ position:relative; z-index:1; flex:1; }
  .navitem{
    display:flex; align-items:center; gap:9px; padding:8px 10px 8px 8px; border-radius:20px 8px 8px 20px; color:#D9E8DF;
    font-size:13px; margin:3px 0; border:1px solid transparent; cursor:pointer;
    transition:all .2s var(--ease-smooth); position:relative; z-index:1;
  }
  .navitem .twig{ position:absolute; left:-38px; top:50%; transform:translateY(-50%); width:38px; height:32px; z-index:0; pointer-events:none; }
  .navitem:nth-child(odd) .twig path{ }
  .navitem:hover{ background:rgba(255,255,255,0.08); transform:translateX(2px); }
  .navitem.active{ background:var(--gradient-warm); color:#fff; font-weight:600; box-shadow:0 4px 14px rgba(255,122,69,.35);}
  .role-staff .navitem.active{ background:linear-gradient(120deg, var(--gold-dark), var(--gold)); box-shadow:0 4px 14px rgba(199,154,68,.4); }

  .leaf-badge{
    width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:13.5px; transition:transform .25s var(--ease-bounce);
    background:radial-gradient(circle at 32% 30%, #6fae52, #2c5c30 78%); box-shadow:0 2px 6px rgba(0,0,0,.3);
  }
  .role-staff .leaf-badge{ background:radial-gradient(circle at 32% 30%, var(--gold), var(--gold-dark) 78%); }
  .navitem.active .leaf-badge{ background:rgba(255,255,255,.28); animation:pulseGlow 2s infinite; }
  .navitem:hover .leaf-badge{ transform:scale(1.18) rotate(-6deg); }
  .navitem .lbl{ line-height:1.2; }

  .tree-roots{ position:relative; z-index:1; height:34px; margin:10px -14px -20px -50px; flex-shrink:0; opacity:.85; }
  .tree-roots svg{ width:100%; height:100%; display:block; }
  .role-customer .tree-roots path{ stroke:#4a3520; }
  .role-staff .tree-roots path{ stroke:#3a2e1e; }
  .tree-roots .root-caption{ position:absolute; bottom:2px; left:14px; font-size:9.5px; letter-spacing:.06em; color:rgba(255,255,255,.35); text-transform:uppercase; }

  .main{ flex:1; padding:26px 30px 60px; overflow-y:auto; animation:fadeInUp .45s var(--ease-smooth); }

  .page-head{ display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .page-eyebrow{ font-size:11px; text-transform:uppercase; letter-spacing:.09em; color:var(--ember-dark); font-weight:700; margin-bottom:2px;}
  .page-sub{ color:var(--ink-soft); font-size:13.5px; margin-top:2px;}

  /* trail divider signature element */
  .trail{ display:flex; align-items:center; gap:8px; margin:22px 0 18px; }
  .trail .dot{ width:7px; height:7px; border-radius:50%; background:var(--ember); flex-shrink:0; box-shadow:0 0 0 4px var(--ember-light);}
  .trail .dash{ flex:1; height:0; border-top:2px dashed var(--line); }
  .trail .label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); white-space:nowrap;}

  /* ---------- Cards / layout ---------- */
  .card{
    background:
      repeating-linear-gradient(45deg, rgba(94,74,48,0.025) 0 1px, transparent 1px 9px),
      repeating-linear-gradient(-45deg, rgba(94,74,48,0.025) 0 1px, transparent 1px 9px),
      var(--paper);
    border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow); animation:fadeInUp .4s var(--ease-smooth) both; transition:transform .25s var(--ease-smooth), box-shadow .25s var(--ease-smooth);
  }
  .card:hover{ box-shadow:var(--shadow-lg); transform:translateY(-2px); }
  .grid{ display:grid; gap:16px; }
  .grid-2{ grid-template-columns:1fr 1fr; }
  .grid-3{ grid-template-columns:repeat(3,1fr); }
  .grid-4{ grid-template-columns:repeat(4,1fr); }
  @media (max-width:1000px){ .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} }
  .grid-3 > *:nth-child(1),.grid-4 > *:nth-child(1){ animation-delay:.02s; }
  .grid-3 > *:nth-child(2),.grid-4 > *:nth-child(2){ animation-delay:.08s; }
  .grid-3 > *:nth-child(3),.grid-4 > *:nth-child(3){ animation-delay:.14s; }
  .grid-3 > *:nth-child(4),.grid-4 > *:nth-child(4){ animation-delay:.2s; }

  .stat-card{ background:var(--paper); border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; animation:fadeInUp .4s var(--ease-smooth) both; transition:transform .25s var(--ease-smooth), box-shadow .25s var(--ease-smooth), border-color .25s; position:relative; overflow:hidden; }
  .stat-card::before{ content:''; position:absolute; inset:0 auto auto 0; width:4px; height:100%; background:var(--gradient-warm); }
  .stat-card:hover{ transform:translateY(-3px); box-shadow:var(--shadow-lg); border-color:var(--teal); }
  .stat-card .stat-label{ font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px;}
  .stat-card .stat-value{ font-family:'Fraunces',serif; font-size:30px; font-weight:700; background:var(--gradient-cool); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .stat-card .stat-note{ font-size:12px; color:var(--ink-soft); margin-top:4px;}

  /* form elements */
  label{ display:block; font-size:12.5px; font-weight:600; color:var(--bark); margin-bottom:5px; }
  .field{ margin-bottom:14px; }
  input[type=text], input[type=email], input[type=password], input[type=date], input[type=number], input[type=tel], select, textarea{
    width:100%; padding:9px 11px; border:1.5px solid var(--line); border-radius:9px; background:#fff; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 4px var(--teal-light);}
  .hint{ font-size:11.5px; color:var(--ink-soft); margin-top:4px;}
  .row{ display:flex; gap:12px; flex-wrap:wrap;}
  .row > *{ flex:1; min-width:160px;}

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:9px 16px; border-radius:9px; border:1px solid transparent; font-size:13.5px; font-weight:600; transition:transform .18s var(--ease-bounce), box-shadow .2s var(--ease-smooth), background .2s var(--ease-smooth); position:relative; }
  .btn:active{ transform:scale(.96); }
  .btn-primary{ background:var(--gradient-warm); color:#fff; box-shadow:0 4px 14px rgba(255,122,69,.35); }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(255,122,69,.45); }
  .btn-forest{ background:var(--gradient-cool); color:#fff; box-shadow:0 4px 14px rgba(11,110,79,.3); }
  .btn-forest:hover{ transform:translateY(-2px); box-shadow:0 8px 22px rgba(11,110,79,.4); }
  .btn-ghost{ background:transparent; border:1.5px solid var(--line); color:var(--ink); }
  .btn-ghost:hover{ background:var(--teal-light); border-color:var(--teal); transform:translateY(-1px); }
  .btn-danger{ background:transparent; border:1.5px solid var(--danger); color:var(--danger); }
  .btn-danger:hover{ background:var(--danger-light); transform:translateY(-1px); }
  .btn-sm{ padding:5px 10px; font-size:12px; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; transform:none !important; box-shadow:none !important; }

  /* status chips / tag */
  .chip{ display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; animation:popIn .3s var(--ease-bounce) both; }
  .chip-success{ background:var(--success-light); color:var(--success); }
  .chip-warn{ background:var(--warn-light); color:var(--warn); }
  .chip-danger{ background:var(--danger-light); color:var(--danger); }
  .chip-teal{ background:var(--teal-light); color:var(--teal); }

  /* luggage-tag style reference number */
  .tag-ref{
    display:inline-flex; align-items:center; gap:8px; font-family:'JetBrains Mono', monospace; font-size:12.5px;
    background:var(--paper); border:1.5px dashed var(--bark); border-radius:6px; padding:5px 10px 5px 8px; color:var(--bark); font-weight:600;
  }
  .tag-ref .hole{ width:8px; height:8px; border-radius:50%; background:var(--cream); border:1.5px solid var(--bark); }

  table{ width:100%; border-collapse:collapse; font-size:13.5px; }
  th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); padding:8px 10px; border-bottom:2px solid var(--line);}
  td{ padding:10px; border-bottom:1px solid var(--line); vertical-align:middle; transition:background .15s var(--ease-smooth);}
  tr{ transition:background .15s var(--ease-smooth); }
  tr:hover td{ background:var(--teal-light); }

  .alert{ padding:11px 14px; border-radius:9px; font-size:13px; margin-bottom:14px; border:1px solid; animation:fadeInUp .3s var(--ease-smooth) both; }
  .alert-error{ background:var(--danger-light); border-color:#F3B8B8; color:var(--danger); }
  .alert-success{ background:var(--success-light); border-color:#B9D6BE; color:var(--success); }
  .alert-info{ background:var(--teal-light); border-color:#9FE3DA; color:var(--teal); }

  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .big{ font-size:32px; margin-bottom:8px; }

  /* login */
  .login-wrap{ min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; background:var(--cream); padding:20px;}
  .login-wrap::before, .login-wrap::after{
    content:''; position:absolute; border-radius:50%; filter:blur(60px); opacity:.35; z-index:0;
    animation:floatY 9s ease-in-out infinite;
  }
  .login-wrap::before{ width:420px; height:420px; background:var(--ember); top:-120px; left:-100px; }
  .login-wrap::after{ width:380px; height:380px; background:var(--teal); bottom:-140px; right:-100px; animation-delay:1.5s; }
  .login-card{ width:100%; max-width:960px; display:grid; grid-template-columns:1fr 1fr; background:var(--paper); border-radius:20px; overflow:hidden; box-shadow:var(--shadow-lg); border:1px solid var(--line); position:relative; z-index:1; animation:fadeInUp .5s var(--ease-smooth) both;}
  .login-side{ background:var(--gradient-hero); background-size:220% 220%; animation:gradientShift 16s ease infinite; color:#EFE9D8; padding:40px 34px; display:flex; flex-direction:column; justify-content:space-between; position:relative; overflow:hidden;}
  .login-treeline{ position:absolute; left:0; right:0; bottom:0; height:90px; z-index:1; opacity:.55; pointer-events:none; }
  .login-treeline svg{ width:100%; height:100%; display:block; }
  .login-treeline path{ fill:rgba(6,20,12,.55); }
  .login-side .ember{ position:absolute; z-index:1; width:5px; height:5px; border-radius:50%; background:var(--gold); box-shadow:0 0 8px 2px rgba(199,154,68,.7); bottom:10px; animation:emberRise 6s ease-in infinite; pointer-events:none; }

/* ---------------------------- Persistent storage ----------------------------
   The whole DB (users, campsites, tents, activities, bookings, payments) is
   saved as one record, mirroring the central data store shown in the context
   diagram (Customer <-> System <-> Staff, all reading/writing the same store).

   Storage tiers, tried in order:
   1. window.storage — available when this file is viewed inside Claude.ai's
      artifact panel.
   2. localStorage — used when this file is downloaded and opened directly in
      a normal browser tab (window.storage doesn't exist there). Persists on

   3. In-memory only — final fallback if neither is available (e.g. private

   ------------------------------------------------------------------------- */
const DB_KEY = 'perong-campsite-db';

function testLocalStorage(){

    localStorage.removeItem(k);

const storageMode = hasClaudeStorage ? 'claude' : (hasLocalStorage ? 'local' : 'none');

async function loadDB(){
  if(storageMode==='claude'){
    try{
      const result = await window.storage.get(DB_KEY, false);
      if(result && result.value){ DB = JSON.parse(result.value); return true; }
    }catch(e){ /* no saved record yet — first run, fall back to seed data */ }
    return false;
  }
  if(storageMode==='local'){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(raw){ DB = JSON.parse(raw); return true; }
    }catch(e){ /* corrupted or unreadable — fall back to seed data */ }
    return false;

async function saveDB(){

  if(storageMode==='local'){
    try{
      localStorage.setItem(DB_KEY, JSON.stringify(DB));

      console.error('Storage error:', e);
      toast('Could not save changes — browser storage is full or blocked.', 'error');

    return;

/* ---------------------------- Plot holds (Safety Requirement 5.2) ----------------------------

   book the exact same plot for the same dates at the same time. Once a user selects a plot and
   proceeds to the booking form, that plot is temporarily reserved to stop other users from
   checking out with the same slot."

function purgeExpiredHolds(){
  const now = Date.now();

  purgeExpiredHolds();
  return (DB.holds || []).find(h => h.campsiteId===campsiteId && h.customerEmail!==excludeEmail &&
    rangesOverlap(checkIn, checkOut, h.checkIn, h.checkOut)) || null;
}
function releaseHoldsFor(customerEmail){
  DB.holds = (DB.holds || []).filter(h => h.customerEmail !== customerEmail);
}

}

/* ---------------------------- Per-tab session ----------------------------
   IMPORTANT: this uses sessionStorage (not localStorage), which is scoped to
   a single browser tab. That means each open tab remembers its OWN login
   independently — reloading the staff tab keeps you logged in as staff, and
   reloading the customer tab keeps you logged in as that customer, even
   though both tabs read/write the same shared DB. This is what lets you demo
   a customer tab and a staff tab side by side without them fighting over
   who's logged in.
   ------------------------------------------------------------------------- */
const SESSION_KEY = 'perong-campsite-session';
function testSessionStorage(){
  try{
    const k = '__perong_session_test__';
    sessionStorage.setItem(k, '1');
    sessionStorage.removeItem(k);
    return true;
  }catch(e){ return false; }
}
const hasSessionStorage = (typeof sessionStorage !== 'undefined') && testSessionStorage();

function saveSession(email){
  if(!hasSessionStorage) return;
  try{ sessionStorage.setItem(SESSION_KEY, JSON.stringify({email})); }catch(e){ /* ignore */ }
}
function clearSession(){
  if(!hasSessionStorage) return;
  try{ sessionStorage.removeItem(SESSION_KEY); }catch(e){ /* ignore */ }
}
function restoreSession(){
  if(!hasSessionStorage) return null;
  try{
    const raw = sessionStorage.getItem(SESSION_KEY);
    if(!raw) return null;
    const {email} = JSON.parse(raw);
    const u = DB.users.find(x=>x.email===email);
    if(!u){ clearSession(); return null; }
    if(u.role==='staff' && u.active===false){ clearSession(); return null; }
    return u;
  }catch(e){ return null; }
}

/* ---------------------------- Live cross-tab sync ----------------------------
   When localStorage is the active storage tier, other tabs of the same
   browser automatically fire a "storage" event whenever the shared DB record
   changes. We listen for that and refresh this tab's copy of the data (and
   re-render whatever page it's currently on) WITHOUT touching this tab's own
   login session — so e.g. a booking made in the customer tab shows up in the
   staff tab's Manage Bookings list automatically, no reload needed.
   ------------------------------------------------------------------------- */
if(storageMode==='local'){
  window.addEventListener('storage', (e)=>{
    if(e.key !== DB_KEY || !e.newValue) return;
    try{
      DB = JSON.parse(e.newValue);
      if(state.user){ render(); }
    }catch(err){ /* ignore malformed update */ }
  });
}

function nights(a,b){ const d1=new Date(a), d2=new Date(b); return Math.max(1, Math.round((d2-d1)/(1000*60*60*24))); }

/* ---- Campsite closures: date-range OR "until turned back on" (indefinite) ---- */
function closureEndDate(cl){ return cl.type==='indefinite' ? '9999-12-31' : cl.endDate; }
function isCampsiteClosedForRange(c, checkIn, checkOut){
  return (c.closures||[]).some(cl => !(checkOut <= cl.startDate || checkIn > closureEndDate(cl)));
}
function isCampsiteClosedToday(c){
  const today = new Date().toISOString().slice(0,10);
  return (c.closures||[]).some(cl => today >= cl.startDate && today <= closureEndDate(cl));
}
function activeClosureFor(c){
  const today = new Date().toISOString().slice(0,10);
  return (c.closures||[]).find(cl => today >= cl.startDate && today <= closureEndDate(cl)) || null;
}
function closureSummary(cl){
  const reasonPart = cl.reason ? ' — ' + esc(cl.reason) : '';
  return cl.type==='indefinite'
    ? ('Closed from ' + fmtDate(cl.startDate) + ' until reopened' + reasonPart)
    : ('Closed ' + fmtDate(cl.startDate) + ' → ' + fmtDate(cl.endDate) + reasonPart);
}
function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type ? ' '+type : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.remove(); }, 3200);
}
function go(page, ctx){ state.page = page; state.ctx = ctx || {}; render(); window.scrollTo(0,0); }
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function esc(s){ return (s===undefined||s===null) ? '' : String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------------------------- Shared validation helpers ---------------------------- */
function namesClash(a,b){ return String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase(); }
function isDuplicateName(list, field, name, excludeId){
  return list.some(item => item.id!==excludeId && namesClash(item[field], name));
}
function isValidEmail(email){
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(email||'').trim());
}
function isNegativeNumber(val){
  const n = parseFloat(val);
  return isNaN(n) || n < 0;
}

/* Composable "scene" — sky, sun/moon, hills, ground (river/hill/forest),
   trees, an optional tent, and an optional extra (campfire / kayak /
   trail / waterfall). Everything is procedurally drawn, so it always
   renders identically with zero network requests. */
function natureScene(o){
  const id = o.id;
  const groundY = 172;
  let groundEl = '', extraEl = '', tentEl = '';

  if(o.ground==='river'){
    groundEl = `
      <path d="M0 ${groundY} C 60 ${groundY-10}, 120 ${groundY+8}, 200 ${groundY-6} C 280 ${groundY-14}, 340 ${groundY+6}, 400 ${groundY-4} L400 220 L0 220 Z" fill="url(#water-${id})"/>

      <path d="M0 ${groundY+36} C 90 ${groundY+28}, 180 ${groundY+42}, 400 ${groundY+30}" stroke="rgba(255,255,255,.18)" stroke-width="2" fill="none"/>`;
  } else if(o.ground==='hill'){
    groundEl = `<path d="M0 220 L0 ${groundY+22} C 100 ${groundY-18}, 260 ${groundY+30}, 400 ${groundY-10} L400 220 Z" fill="${o.groundColor}"/>
      <path d="M0 220 L0 ${groundY+34} C 120 ${groundY+2}, 250 ${groundY+40}, 400 ${groundY+6} L400 220 Z" fill="${o.groundColor2}" opacity=".7"/>`;
  } else {
    groundEl = `<path d="M0 220 L0 ${groundY+16} C 120 ${groundY}, 260 ${groundY+20}, 400 ${groundY+6} L400 220 Z" fill="${o.groundColor}"/>`;
  }

  if(o.extra==='campfire'){
    const fx = o.tentX - 52, fy = groundY - 2;
    extraEl = `<g transform="translate(${fx},${fy})">
      <rect x="-8" y="-2" width="16" height="4" fill="#5c4022" transform="rotate(18)"/>
      <rect x="-8" y="-2" width="16" height="4" fill="#4a3218" transform="rotate(-22)"/>
      <ellipse cx="0" cy="-3" rx="5.5" ry="8" fill="#e8b13a" opacity="${o.fireLit?0.92:0.14}"/>
      <ellipse cx="0" cy="-5" rx="3.2" ry="5.5" fill="#f6df8a" opacity="${o.fireLit?0.95:0.10}"/>
    </g>`;
  } else if(o.extra==='kayak'){
    extraEl = `<g transform="translate(228,${groundY+26})">
      <path d="M-36 0 C -36 -9, 36 -9, 36 0 C 36 7, -36 7, -36 0 Z" fill="#C1622B"/>
      <path d="M-30 -1 C -30 -6, 30 -6, 30 -1" fill="#9c4b1e"/>
      <line x1="-2" y1="-20" x2="14" y2="8" stroke="#5c4630" stroke-width="3.4" stroke-linecap="round"/>

      <ellipse cx="14" cy="8" rx="5.5" ry="2.2" fill="#5c4630"/>
    </g>`;
  } else if(o.extra==='trail'){
    extraEl = `<path d="M160 220 C 185 178, 145 150, 188 118 C 222 92, 198 66, 232 34" stroke="#d8c093" stroke-width="18" fill="none" opacity=".6" stroke-linecap="round"/>
      <circle cx="176" cy="150" r="2.4" fill="#8a7350" opacity=".6"/><circle cx="196" cy="104" r="2.4" fill="#8a7350" opacity=".6"/>`;
  } else if(o.extra==='waterfall'){
    extraEl = `
      <rect x="148" y="14" width="30" height="160" fill="url(#fall-${id})" opacity=".92"/>
      <ellipse cx="163" cy="176" rx="34" ry="11" fill="#e8f6fa" opacity=".8"/>
      <path d="M40 56 A 100 100 0 0 1 320 66" stroke="#e8607a" stroke-width="4" fill="none" opacity=".55"/>
      <path d="M52 62 A 92 92 0 0 1 310 72" stroke="#f0a24a" stroke-width="4" fill="none" opacity=".55"/>
      <path d="M64 68 A 84 84 0 0 1 300 78" stroke="#e8d24a" stroke-width="4" fill="none" opacity=".55"/>
      <path d="M76 74 A 76 76 0 0 1 290 84" stroke="#6fae52" stroke-width="4" fill="none" opacity=".5"/>`;
  }

  const trees = (o.trees||[]).map(t=>svgTree(t[0],t[1],t[2],o.treeDark,o.treeLight)).join('');

  if(o.showTent!==false){
    const tentY = o.ground==='river' ? groundY : (o.ground==='hill' ? groundY-16 : groundY+10);
    tentEl = svgTentA(o.tentX, tentY, o.tentScale||1, o.tentColor, o.tentColor2);
  }
  if(o.vehicle){ extraEl += svgVehicle(300, groundY+18, 0.9); }

  return `<svg viewBox="0 0 400 220" xmlns="http://www.w3.org/2000/svg" class="scene-svg" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${esc(o.label||'')}">
    <defs>
      <linearGradient id="sky-${id}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${o.skyTop}"/><stop offset="100%" stop-color="${o.skyBottom}"/>
      </linearGradient>
      <linearGradient id="water-${id}" x1="0" y1="0" x2="0" y2="1">

      ${o.extra==='waterfall'?`<linearGradient id="fall-${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#f2fbfd"/><stop offset="100%" stop-color="#bfe1ea"/></linearGradient>`:''}
    </defs>
    <rect width="400" height="220" fill="url(#sky-${id})"/>
    ${o.moon ? `<circle cx="${o.sunX}" cy="${o.sunY}" r="${o.sunR||16}" fill="${o.sunColor}"/><circle cx="${o.sunX-5}" cy="${o.sunY-3}" r="${(o.sunR||16)-4}" fill="${o.skyTop}" opacity=".85"/>` : ''}

    ${o.hillFar? `<path d="${o.hillFar}" fill="${o.hillFarColor}" opacity=".5"/>`:''}
    ${trees}
    ${groundEl}
    ${extraEl}
    ${tentEl}
  </svg>`;
}

function openModal(title, bodyHtml, actionsHtml){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.id = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-box"><h3>${title}</h3><div>${bodyHtml}</div><div class="modal-actions">${actionsHtml}</div></div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) closeModal(); });
}
function closeModal(){ const m = document.getElementById('modal-overlay'); if(m) m.remove(); }

/* ---------------------------- Auth ---------------------------- */
function handleAuthSubmit(e){
  e.preventDefault();
  const form = e.target;
  const email = form.email.value.trim();
  const password = form.password.value;
  const fullName = form.fullName ? form.fullName.value.trim() : '';

  if(state.authMode==='register'){
    if(!fullName || !email || !password){
      showAuthError('E3: Please complete all required fields.'); return;
    }
    if(!isValidEmail(email)){
      showAuthError('Invalid email format.'); return;
    }
    if(password.length < 8){
      showAuthError('Password must contain at least 8 characters.'); return;
    }
    if(DB.users.find(u=>u.email===email)){
      showAuthError('E2: Email already exists.'); return;
    }
    DB.users.push({email, password, fullName, role:'customer'});
    saveDB();
    showAuthSuccess('Account created! You can now log in.');
    state.authMode='login';
    setTimeout(render, 900);
    return;
  }

  // login
  const roleWanted = state.authRole;
  const u = DB.users.find(x=>x.email===email && x.role===roleWanted);
  if(!u || u.password !== password){
    showAuthError('E1: Invalid email or password.'); return;
  }
  if(u.role==='staff' && u.active===false){
    showAuthError('E2: Account has been deactivated. Please contact the administrator.');
    openModal('Account Deactivated',
      `<p style="font-size:13.5px; color:var(--ink-soft);">This account has been deactivated. Please contact the administrator for assistance.</p>`,
      `<button class="btn btn-primary" onclick="closeModal()">OK</button>`);
    return;
  }
  state.user = u; state.role = u.role;
  saveSession(u.email);
  toast(`Welcome back, ${u.fullName.split(' ')[0]}!`, 'success');
  if(u.role==='customer') go('customer-home');
  else go('admin-dashboard');
}
function showAuthError(msg){
  const el = document.getElementById('auth-alert');
  if(el){ el.className='alert alert-error'; el.textContent = msg; el.style.display='block'; }
}
function showAuthSuccess(msg){
  const el = document.getElementById('auth-alert');
  if(el){ el.className='alert alert-success'; el.textContent = msg; el.style.display='block'; }
}
function logout(){ clearSession(); state.user=null; state.role=null; go('login'); toast('You have been logged out.'); }

function submitAvailabilityCheck(e){
  e.preventDefault();
  const f = e.target;
  const checkIn = f.checkIn.value, checkOut = f.checkOut.value;
  const numCampers = parseInt(f.numCampers.value, 10);
  const preferredPlot = f.preferredPlot.value;
  const results = document.getElementById('availability-results');

  if(isNegativeNumber(f.numCampers.value) || !numCampers || numCampers < 1){
    results.innerHTML = `<div class="alert alert-error">Number of campers cannot be negative or zero.</div>`;
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  // E2: invalid dates
  if(!checkIn || !checkOut || checkIn < today || checkOut <= checkIn){
    results.innerHTML = `<div class="alert alert-error">E2: Invalid date selection! Check-out must be after check-in, and dates cannot be in the past.</div>`;
    return;
  }
  // E3: seasonal closure block
  const sc = DB.seasonalClosure;
  if(!(checkOut <= sc.start || checkIn >= sc.end)){
    results.innerHTML = `<div class="alert alert-error">E3: Campsite is closed during this period (${fmtDate(sc.start)} – ${fmtDate(sc.end)}, ${sc.label}). Please choose another date.</div>`;
    return;
  }

  let list = DB.campsites.filter(c=>!isCampsiteClosedForRange(c, checkIn, checkOut) && c.capacity>=numCampers);
  if(preferredPlot) list = list.filter(c=>c.id===preferredPlot);
  const myEmail = state.user ? state.user.email : null;
  // simple overlap check against existing confirmed/pending bookings on same plot & date range,
  // plus any active checkout hold placed by another customer (Safety Requirement 5.2)
  list = list.filter(c=>{
    const clash = DB.bookings.some(b=> b.campsiteId===c.id && b.status!=='Cancelled' &&
      !(checkOut<=b.checkIn || checkIn>=b.checkOut));
    const held = findBlockingHold(c.id, checkIn, checkOut, myEmail);
    return !clash && !held;
  });

  if(list.length===0){
    results.innerHTML = `<div class="alert alert-error">E1: No campsite slots available for these dates. Please choose another date.</div>`;
    return;
  }

  const nightsCount = nights(checkIn, checkOut);
  results.innerHTML = `
    <div class="trail"><div class="dot"></div><div class="dash"></div><div class="label">${list.length} plot(s) open · ${nightsCount} night(s)</div><div class="dash"></div></div>
    <div class="grid grid-3">
      ${list.map(c=>`
        <div class="campsite-card">
          <div class="campsite-thumb">${campsitePhoto(c.id, 500, true)}</div>
          <div class="campsite-body">
            <h3 style="font-size:15px;">${esc(c.name)}</h3>
            <div class="page-sub">${esc(c.location)} · fits up to ${c.capacity}</div>
            <div class="campsite-price">${money(c.rate*nightsCount)} <span style="font-size:11.5px; font-weight:400; color:var(--ink-soft);">total (${nightsCount} night${nightsCount>1?'s':''})</span></div>
            <button class="btn btn-primary btn-sm" onclick="selectPlotForBooking('${c.id}','${checkIn}','${checkOut}',${numCampers})">Select &amp; continue</button>
          </div>
        </div>`).join('')}
    </div>`;
}

function selectPlotForBooking(campsiteId, checkIn, checkOut, numCampers){
  const myEmail = state.user ? state.user.email : null;
  const blocking = findBlockingHold(campsiteId, checkIn, checkOut, myEmail);
  if(blocking){
    toast('Sorry — another camper just started checking out this plot for these dates. Please try again in a few minutes or pick another plot.', 'error');
    return;
  }
  // a customer can only hold one plot/date-range at a time
  releaseHoldsFor(myEmail);
  const holdId = 'HLD' + Date.now();
  DB.holds.push({id:holdId, campsiteId, checkIn, checkOut, customerEmail:myEmail, expiresAt: Date.now()+HOLD_DURATION_MS});
  saveDB();
  go('booking-form', {campsiteId, checkIn, checkOut, numCampers, holdId});
}

function updateBookingSummary(){
  const ctx = state.ctx;
  const form = document.getElementById('booking-form-el');
  const linesBox = document.getElementById('summary-lines');
  const totalBox = document.getElementById('summary-total');
  if(!form || !linesBox || !totalBox) return;

  const campsiteId = form.campsiteId.value;
  const checkIn = form.checkIn.value, checkOut = form.checkOut.value;
  const c = byId(DB.campsites, campsiteId);
  const nightsCount = nights(checkIn, checkOut);
  const numVisitors = Math.max(1, parseInt(form.numVisitors.value,10) || 1);

  let total = c.rate * nightsCount;
  let lines = '';

  // tents already chosen in Use Case 5 (step 3) carry through and stay reflected here
  (ctx.tentRentals||[]).forEach(tr=>{
    const t = byId(DB.tents, tr.tentId);
    if(t){
      const lineCost = t.rate * tr.qty * nightsCount;
      total += lineCost;
      lines += `<div class="kv"><div class="k">${esc(t.type)} × ${tr.qty} (tent rental)</div><div>${money(lineCost)}</div></div>`;
    }
  });

  DB.activities.forEach(a=>{
    const box = form['act_'+a.id];
    if(box && box.checked){
      const lineCost = a.price * numVisitors;
      total += lineCost;
      lines += `<div class="kv"><div class="k">${esc(a.name)} × ${numVisitors}</div><div>${money(lineCost)}</div></div>`;
    }
  });

  linesBox.innerHTML = lines;
  totalBox.textContent = money(total);
}

// Collects and validates the Booking Details (Use Case 4) fields from the form. Returns the
// merged ctx object on success, or null (with an inline error shown) if validation fails.
function collectStep2Details(){
  const f = document.getElementById('booking-form-el');
  const alertBox = document.getElementById('booking-alert');
  const campsiteId = f.campsiteId.value;
  const checkIn = f.checkIn.value, checkOut = f.checkOut.value;
  const numVisitors = parseInt(f.numVisitors.value,10);
  const plateNumber = f.plateNumber.value.trim();
  const contact = f.contact.value.trim();

  // E1: missing required fields
  if(!numVisitors || !plateNumber || !contact){
    alertBox.innerHTML = `<div class="alert alert-error">E1: Booking not created — please fill in all required booking information.</div>`;
    return null;
  }
  if(isNegativeNumber(f.numVisitors.value)){
    alertBox.innerHTML = `<div class="alert alert-error">Number of visitors cannot be negative.</div>`;
    return null;
  }
  const c = byId(DB.campsites, campsiteId);
  // E2: invalid data
  if(numVisitors > c.capacity){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Invalid booking details — this plot fits a maximum of ${c.capacity} campers.</div>`;
    return null;
  }
  const activities = [];
  DB.activities.forEach(a=>{
    const box = f['act_'+a.id];
    if(box && box.checked) activities.push(a.id);
  });
  return {...state.ctx, campsiteId, checkIn, checkOut, numVisitors, plateNumber, contact, activities};
}

function updateTentRentalSummary(){
  const ctx = state.ctx;
  const c = byId(DB.campsites, ctx.campsiteId);
  const form = document.getElementById('tent-rental-form-el');
  const linesBox = document.getElementById('tent-summary-lines');
  const totalBox = document.getElementById('tent-summary-total');
  if(!form || !linesBox || !totalBox || !c) return;
  const nightsCount = nights(ctx.checkIn, ctx.checkOut);
  let total = c.rate * nightsCount;
  let lines = '';

  DB.tents.forEach(t=>{
    const field = form['tentQty_'+t.id];
    const qty = field ? Math.max(0, parseInt(field.value,10) || 0) : 0;
    if(qty > 0){
      const lineCost = t.rate * qty * nightsCount;

      lines += `<div class="kv"><div class="k">${esc(t.type)} × ${qty}</div><div>${money(lineCost)}</div></div>`;
    }
  });

  (ctx.activities||[]).forEach(aid=>{
    const a = byId(DB.activities, aid);
    if(a){
      const lineCost = a.price * ctx.numVisitors;
      total += lineCost;
      lines += `<div class="kv"><div class="k">${esc(a.name)} × ${ctx.numVisitors}</div><div>${money(lineCost)}</div></div>`;
    }
  });

  linesBox.innerHTML = lines;

// "Add to booking & continue" on the tent rental step — validates stock (E1) then books.
function confirmTentRental(){
  const ctx = state.ctx;
  const form = document.getElementById('tent-rental-form-el');
  const alertBox = document.getElementById('tent-alert');

  for(const t of DB.tents){
    const qtyField = form['tentQty_'+t.id];
    if(qtyField && isNegativeNumber(qtyField.value)){
      alertBox.innerHTML = `<div class="alert alert-error">Tent quantity for ${esc(t.type)} cannot be negative.</div>`;
      return;
    }
  }
  const tentRentals = [];
  for(const t of DB.tents){
    const qtyField = form['tentQty_'+t.id];
    const qty = qtyField ? parseInt(qtyField.value,10) : 0;
    if(qty > 0){
      if(qty > t.available){
        alertBox.innerHTML = `<div class="alert alert-error">E1: "Tent not Available" — only ${t.available} × ${esc(t.type)} left. Please reduce quantity.</div>`;
        return;
      }
      tentRentals.push({tentId:t.id, qty});
    }
  }
  if(tentRentals.length===0){
    alertBox.innerHTML = `<div class="alert alert-error">Please choose at least one tent, or use "Skip — no tent needed" instead.</div>`;
    return;
  }
  finalizeBooking({...ctx, tentRentals});
}

function skipTentFromStep3(){
  finalizeBooking({...state.ctx, tentRentals: []});
}

// Preserves any tent quantities already entered when the customer steps back to edit details.

}

// Final booking creation shared by both the "skip tent rental" and "confirm tent rental" paths —
// this is the actual Use Case 4 "system creates booking record" step, run once all optional
// Use Case 5 (tent) and activity choices have been made.
function finalizeBooking(details){
  const campsiteId = details.campsiteId, checkIn = details.checkIn, checkOut = details.checkOut;
  const numVisitors = details.numVisitors, plateNumber = details.plateNumber, contact = details.contact;
  const tentRentals = details.tentRentals || [];
  const activityIds = details.activities || [];
  const c = byId(DB.campsites, campsiteId);
  if(!c){ toast('Something went wrong — please start again from Check Availability.', 'error'); go('check-availability'); return; }

  // final overlap/lock check at submit time (Safety Requirement 5.2)
  const clash = DB.bookings.some(b=> b.campsiteId===c.id && b.status!=='Cancelled' && !(checkOut<=b.checkIn || checkIn>=b.checkOut));
  if(clash){
    toast('E1: No campsite slots available — this plot was just booked for an overlapping date.', 'error');
    go('check-availability');
    return;
  }
  // re-check tent stock right before creating the booking, in case it moved since step 3
  for(const tr of tentRentals){
    const t = byId(DB.tents, tr.tentId);
    if(!t || tr.qty > t.available){
      toast('E1: "Tent not Available" — stock changed while you were checking out. Please review your tent rental.', 'error');
      go('tent-rental-form', details);
      return;
    }
  }

  const nightsCount = nights(checkIn, checkOut);
  let total = c.rate * nightsCount;
  tentRentals.forEach(tr=>{ const t=byId(DB.tents,tr.tentId); total += t.rate * tr.qty * nightsCount; });
  const activities = activityIds.map(aid=>({id:aid, pax:numVisitors}));
  activityIds.forEach(aid=>{ const a=byId(DB.activities,aid); if(a) total += a.price * numVisitors; });

  DB.refSeq += 1;
  const refNum = 'PC-2026-' + String(DB.refSeq).padStart(4,'0');
  const booking = {
    id:refNum, refNum, customerEmail:state.user.email, customerName:state.user.fullName,
    campsiteId, checkIn, checkOut, numVisitors, plateNumber, contact,
    tentRentals, activities, status:'Pending', paymentStatus:'Unpaid', totalCost:total,
    createdAt:new Date().toISOString().slice(0,10),
  };
  DB.bookings.push(booking);
  // decrement tent inventory
  tentRentals.forEach(tr=>{ const t=byId(DB.tents,tr.tentId); t.available = Math.max(0, t.available - tr.qty); });
  // the plot is now actually booked, so the temporary checkout hold can be released
  releaseHoldsFor(state.user.email);
  saveDB();

  toast('Booking created — reference ' + refNum, 'success');
  go('booking-confirmation', {refNum});
}

function submitPayment(e, refNum){
  e.preventDefault();
  const f = e.target;
  const alertBox = document.getElementById('pay-alert');
  const cardNumber = f.cardNumber.value.trim();
  // E2: invalid payment info (demo rule: must be at least 6 chars)
  if(cardNumber.length < 6){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Invalid Payment Information — please check your details and try again.</div>`;
    return;
  }
  // E1: simulate random transaction failure if reference number ends in '0'
  if(cardNumber.trim().endsWith('0')){
    alertBox.innerHTML = `<div class="alert alert-error">E1: Payment Failed — the transaction could not be processed. Please try again.</div>`;
    return;
  }
  const b = DB.bookings.find(x=>x.refNum===refNum);
  const pmt = {id:'PMT'+String(DB.payments.length+1).padStart(2,'0'), bookingId:refNum, method:f.method.value, amount:b.totalCost, status:'Success', date:new Date().toISOString().slice(0,10)};
  DB.payments.push(pmt);
  b.paymentStatus='Paid';
  b.status='Confirmed';
  saveDB();
  toast('Payment successful — booking confirmed!', 'success');
  go('payment-receipt', {refNum});
}

function submitStaffBookingUpdate(e, refNum){
  e.preventDefault();
  const f = e.target;
  const alertBox = document.getElementById('edit-alert');
  const b = DB.bookings.find(x=>x.refNum===refNum);
  if(!b) return;

  const campsiteId = f.campsiteId.value;
  const checkIn = f.checkIn.value, checkOut = f.checkOut.value;
  const numVisitors = parseInt(f.numVisitors.value,10);
  const plateNumber = f.plateNumber.value.trim();
  const contact = f.contact.value.trim();

  if(!campsiteId || !checkIn || !checkOut || !numVisitors || !plateNumber || !contact){
    alertBox.innerHTML = `<div class="alert alert-error">E1: Booking Update Failed — please complete all fields with valid information.</div>`;
    return;
  }
  if(isNegativeNumber(numVisitors)){
    alertBox.innerHTML = `<div class="alert alert-error">Number of visitors cannot be negative.</div>`;
    return;
  }
  if(checkOut <= checkIn){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Invalid booking details — check-out date must be after check-in date.</div>`;
    return;
  }
  const c = byId(DB.campsites, campsiteId);
  if(numVisitors > c.capacity){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Invalid booking details — this plot fits a maximum of ${c.capacity} campers.</div>`;
    return;
  }
  if(isCampsiteClosedForRange(c, checkIn, checkOut)){
    const active = (c.closures||[]).find(cl=> !(checkOut<=cl.startDate || checkIn>closureEndDate(cl)));
    alertBox.innerHTML = `<div class="alert alert-error">E3: Campsite is closed during this period${active? ' — '+closureSummary(active) : ''}.</div>`;
    return;
  }
  const clash = DB.bookings.some(other=> other.refNum!==refNum && other.campsiteId===campsiteId && other.status!=='Cancelled' && !(checkOut<=other.checkIn || checkIn>=other.checkOut));
  if(clash){
    alertBox.innerHTML = `<div class="alert alert-error">E1: No campsite slots available — this plot is already booked for an overlapping date.</div>`;
    return;
  }

  const nightsCount = nights(checkIn, checkOut);
  let total = c.rate * nightsCount;
  const newTentRentals = [];
  for(const t of DB.tents){
    const field = f['tentQty_'+t.id];
    const qty = field ? parseInt(field.value,10) : 0;
    if(isNegativeNumber(qty)){
      alertBox.innerHTML = `<div class="alert alert-error">Tent quantity for ${esc(t.type)} cannot be negative.</div>`;
      return;
    }
    if(qty > 0){
      const existing = b.tentRentals.find(tr=>tr.tentId===t.id);
      const currentQty = existing ? existing.qty : 0;
      const maxAvail = t.available + currentQty;
      if(qty > maxAvail){
        alertBox.innerHTML = `<div class="alert alert-error">E1: "Tent not Available" — only ${maxAvail} × ${esc(t.type)} available for this booking.</div>`;
        return;
      }
      newTentRentals.push({tentId:t.id, qty});
      total += t.rate * qty * nightsCount;
    }
  }
  const newActivities = [];
  DB.activities.forEach(a=>{
    const box = f['act_'+a.id];
    if(box && box.checked){ newActivities.push({id:a.id, pax:numVisitors}); total += a.price * numVisitors; }
  });

  // release old tent inventory, then apply new reservations
  b.tentRentals.forEach(tr=>{ const t=byId(DB.tents,tr.tentId); if(t) t.available = Math.min(t.total, t.available + tr.qty); });
  newTentRentals.forEach(tr=>{ const t=byId(DB.tents,tr.tentId); t.available = Math.max(0, t.available - tr.qty); });

  b.campsiteId = campsiteId;
  b.checkIn = checkIn; b.checkOut = checkOut;
  b.numVisitors = numVisitors;
  b.plateNumber = plateNumber;
  b.contact = contact;
  b.tentRentals = newTentRentals;
  b.activities = newActivities;
  b.totalCost = total;
  b.status = f.status.value;
  b.paymentStatus = f.paymentStatus.value;
  saveDB();
  toast('Booking ' + refNum + ' updated.', 'success');
  go('staff-bookings');
}

function submitStaffNewBooking(e){
  e.preventDefault();
  const f = e.target;
  const alertBox = document.getElementById('new-booking-alert');

  const customerEmail = f.customerEmail.value;
  const customer = DB.users.find(u=>u.email===customerEmail && u.role==='customer');
  const campsiteId = f.campsiteId.value;
  const checkIn = f.checkIn.value, checkOut = f.checkOut.value;
  const numVisitors = parseInt(f.numVisitors.value,10);
  const plateNumber = f.plateNumber.value.trim();
  const contact = f.contact.value.trim();

  if(!customer){
    alertBox.innerHTML = `<div class="alert alert-error">E1: Booking not created — please select a registered customer.</div>`;
    return;
  }
  if(!numVisitors || !plateNumber || !contact || !checkIn || !checkOut){
    alertBox.innerHTML = `<div class="alert alert-error">E1: Booking not created — please fill in all required booking information.</div>`;
    return;
  }
  if(isNegativeNumber(f.numVisitors.value)){
    alertBox.innerHTML = `<div class="alert alert-error">Number of visitors cannot be negative.</div>`;
    return;
  }
  if(checkOut <= checkIn){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Invalid booking details — check-out date must be after check-in date.</div>`;
    return;
  }
  const c = byId(DB.campsites, campsiteId);
  if(numVisitors > c.capacity){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Invalid booking details — this plot fits a maximum of ${c.capacity} campers.</div>`;
    return;
  }
  if(isCampsiteClosedForRange(c, checkIn, checkOut)){
    const active = (c.closures||[]).find(cl=> !(checkOut<=cl.startDate || checkIn>closureEndDate(cl)));
    alertBox.innerHTML = `<div class="alert alert-error">E3: Campsite is closed during this period${active? ' — '+closureSummary(active) : ''}. Please choose another date or plot.</div>`;
    return;
  }
  const clash = DB.bookings.some(b=> b.campsiteId===c.id && b.status!=='Cancelled' && !(checkOut<=b.checkIn || checkIn>=b.checkOut));
  if(clash){
    alertBox.innerHTML = `<div class="alert alert-error">E1: No campsite slots available — this plot is already booked for an overlapping date.</div>`;
    return;
  }
  // respect any active customer checkout hold on this plot/date-range (Safety Requirement 5.2)
  if(findBlockingHold(c.id, checkIn, checkOut, null)){
    alertBox.innerHTML = `<div class="alert alert-error">E1: No campsite slots available — a customer is currently checking out this plot for an overlapping date. Please try again shortly.</div>`;
    return;
  }

  const nightsCount = nights(checkIn, checkOut);
  let total = c.rate * nightsCount;
  const tentRentals = [];
  for(const t of DB.tents){
    const qtyField = f['tentQty_'+t.id];
    if(qtyField && isNegativeNumber(qtyField.value)){
      alertBox.innerHTML = `<div class="alert alert-error">Tent quantity for ${esc(t.type)} cannot be negative.</div>`;
      return;
    }
    const qty = qtyField ? parseInt(qtyField.value,10) : 0;
    if(qty > 0){
      if(qty > t.available){
        alertBox.innerHTML = `<div class="alert alert-error">E1: "Tent not Available" — only ${t.available} × ${esc(t.type)} left.</div>`;
        return;
      }
      tentRentals.push({tentId:t.id, qty});
      total += t.rate * qty * nightsCount;
    }
  }
  const activities = [];
  DB.activities.forEach(a=>{
    const box = f['act_'+a.id];
    if(box && box.checked){ activities.push({id:a.id, pax:numVisitors}); total += a.price * numVisitors; }
  });

  DB.refSeq += 1;
  const refNum = 'PC-2026-' + String(DB.refSeq).padStart(4,'0');
  const status = f.status.value;
  const booking = {
    id:refNum, refNum, customerEmail:customer.email, customerName:customer.fullName,

    tentRentals, activities, status, paymentStatus: status==='Confirmed' ? 'Paid' : 'Unpaid', totalCost:total,
    createdAt:new Date().toISOString().slice(0,10),
  };
  DB.bookings.push(booking);
  tentRentals.forEach(tr=>{ const t=byId(DB.tents,tr.tentId); t.available = Math.max(0, t.available - tr.qty); });
  if(status==='Confirmed'){
    DB.payments.push({id:'PMT'+String(DB.payments.length+1).padStart(2,'0'), bookingId:refNum, method:'Recorded by staff', amount:total, status:'Success', date:new Date().toISOString().slice(0,10)});

function submitStaffCustomerAccountUpdate(e, originalEmail){
  e.preventDefault();
  const f = e.target;
  const alertBox = document.getElementById('cust-acct-alert');
  const fullName = f.fullName.value.trim();
  const newEmail = f.email.value.trim();
  const password = f.password.value;

  if(!fullName || !newEmail){
    alertBox.innerHTML = `<div class="alert alert-error">E1: Incomplete Information — please complete all mandatory fields.</div>`;
    return;
  }
  if(!isValidEmail(newEmail)){
    alertBox.innerHTML = `<div class="alert alert-error">Invalid email format.</div>`;
    return;
  }
  if(newEmail !== originalEmail && DB.users.find(x=>x.email===newEmail)){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Email already exists.</div>`;
    return;
  }
  if(password && password.length < 8){
    alertBox.innerHTML = `<div class="alert alert-error">Password must contain at least 8 characters.</div>`;
    return;
  }
  const u = DB.users.find(x=>x.email===originalEmail && x.role==='customer');
  u.fullName = fullName;
  if(password) u.password = password;
  if(newEmail !== originalEmail){
    DB.bookings.forEach(b=>{ if(b.customerEmail===originalEmail) b.customerEmail=newEmail; });
    u.email = newEmail;
  }
  saveDB();
  toast('Account details updated for ' + fullName + '.', 'success');
  go('staff-customer-detail', {email:u.email});
}

function confirmDeleteCustomer(email){
  const u = DB.users.find(x=>x.email===email);
  openModal('Delete customer account?',

function deleteCustomerAccount(email){

  if(idx>-1) DB.users.splice(idx,1);

  closeModal();
  toast('Customer account deleted.');

}

function openAddClosureModal(campsiteId){
  openModal('Add a closure',
    `<div class="field"><label>Closure type</label>
       <select id="cl-type" onchange="document.getElementById('cl-end-wrap').style.display = this.value==='range' ? 'block':'none';">
         <option value="range">Specific date range</option>
         <option value="indefinite">Until manually turned back on</option>
       </select>
     </div>
     <div class="field"><label>Start date</label><input id="cl-start" type="date"></div>
     <div id="cl-end-wrap" class="field"><label>End date</label><input id="cl-end" type="date"></div>
     <div class="field"><label>Reason <span class="hint" style="display:inline;">(optional)</span></label><input id="cl-reason" type="text" placeholder="e.g. Rainy season closure, maintenance, private event"></div>`,

function addClosure(campsiteId){
  const c = byId(DB.campsites, campsiteId);
  const type = document.getElementById('cl-type').value;
  const startDate = document.getElementById('cl-start').value;
  const endDate = document.getElementById('cl-end').value;
  const reason = document.getElementById('cl-reason').value.trim();

  if(!startDate){ toast('Please choose a start date.', 'error'); return; }
  if(type==='range'){
    if(!endDate){ toast('Please choose an end date, or switch to "Until manually turned back on".', 'error'); return; }
    if(endDate < startDate){ toast('E2: Invalid date selection! End date must be on or after the start date.', 'error'); return; }
  }
  if(!c.closures) c.closures = [];
  c.closures.push({
    id:'CL'+String(Date.now()).slice(-6),
    type, startDate,
    endDate: type==='indefinite' ? null : endDate,
    reason, createdAt:new Date().toISOString().slice(0,10),
  });
  saveDB();
  closeModal();
  toast((type==='indefinite' ? 'Plot closed until manually reopened.' : 'Closure added for ' + fmtDate(startDate) + ' → ' + fmtDate(endDate) + '.'), 'success');
  go('staff-campsite-closures', {id:campsiteId});
}
function reopenClosure(campsiteId, closureId){
  const c = byId(DB.campsites, campsiteId);
  c.closures = (c.closures||[]).filter(cl=>cl.id!==closureId);
  saveDB();
  toast('Closure removed — plot availability updated.', 'success');
  go('staff-campsite-closures', {id:campsiteId});
}

      <tbody>${rows}</tbody></table>
    </div>`;

function updateTentTotal(id, val){
  const t = byId(DB.tents,id);
  if(isNegativeNumber(val)){ toast('Total stock cannot be negative.', 'error'); render(); return; }
  const n = parseInt(val,10)||0;
  t.total = n;
  if(t.available > n) t.available = n;
  saveDB();
  toast('Total stock for ' + t.type + ' set to ' + n + '.', 'success');
  render();
}
function updateTentAvailable(id, val){
  const t = byId(DB.tents,id);
  if(isNegativeNumber(val)){ toast('Available stock cannot be negative.', 'error'); render(); return; }
  let n = parseInt(val,10)||0;
  if(n > t.total){ n = t.total; toast('Available cannot exceed total stock — capped at ' + n + '.', 'error'); }
  t.available = n;
  saveDB();
  render();
}
function toggleTentStatus(id){
  const t = byId(DB.tents,id);
  t.status = t.status==='available' ? 'unavailable' : 'available';
  saveDB();
  toast(t.type + ' is now ' + t.status + ' for rental.', 'success');
  render();
}
function openAddTentModal(){
  openModal('Add tent type',
    `<div class="field"><label>Tent type name</label><input id="nt-name" type="text" placeholder="e.g. Deluxe Family Tent (8-pax)"></div>
     <div class="row">
       <div class="field"><label>Rate / night (RM)</label><input id="nt-rate" type="number" min="0" value="50"></div>
       <div class="field"><label>Total stock</label><input id="nt-total" type="number" min="1" value="5"></div>
     </div>`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="addTentType()">Add tent</button>`);
}
function addTentType(){
  const name = document.getElementById('nt-name').value.trim();
  const rateRaw = document.getElementById('nt-rate').value;
  const totalRaw = document.getElementById('nt-total').value;
  const rate = parseFloat(rateRaw)||0;
  const total = parseInt(totalRaw,10)||0;
  if(!name){ toast('Please enter a tent type name.', 'error'); return; }
  if(isDuplicateName(DB.tents, 'type', name)){ toast('A tent type named "' + name + '" already exists. Please use a different name.', 'error'); return; }
  if(isNegativeNumber(rateRaw)){ toast('Rate cannot be negative.', 'error'); return; }
  if(isNegativeNumber(totalRaw)){ toast('Total stock cannot be negative.', 'error'); return; }
  const newId = 'TN' + String(DB.tents.reduce((max,t)=>Math.max(max, parseInt(t.id.replace('TN',''),10)||0), 0) + 1).padStart(2,'0');
  DB.tents.push({id:newId, type:name, rate, total, available:total, status:'available'});
  saveDB();
  closeModal();
  toast('New tent type added.', 'success');
  render();
}
function confirmDeleteTent(id){
  const t = byId(DB.tents, id);
  if(!t) return;
  const usedCount = DB.bookings.filter(b=> b.status!=='Cancelled' && b.tentRentals.some(tr=>tr.tentId===id)).length;
  const warning = usedCount>0
    ? `<p style="font-size:13.5px; color:var(--danger); margin-top:8px;">⚠ This tent type is referenced by ${usedCount} active booking${usedCount>1?'s':''}. Those bookings will still show the rental, but the tent will show as "Removed tent type."</p>`
    : '';
  openModal('Delete tent type?',
    `<p style="font-size:13.5px; color:var(--ink-soft);">This will permanently remove <strong>${esc(t.type)}</strong> from the tent rental options. This cannot be undone.</p>${warning}`,
    `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="deleteTent('${id}')">Delete tent type</button>`);
}
function deleteTent(id){
  const t = byId(DB.tents, id);
  const idx = DB.tents.findIndex(x=>x.id===id);
  if(idx>-1) DB.tents.splice(idx,1);
  saveDB();
  closeModal();
  toast((t?t.type:'Tent type') + ' has been deleted.');
  render();
}
