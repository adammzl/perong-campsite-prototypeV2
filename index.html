}
function renderStaffEditStaff(ctx){
  const u = DB.users.find(x=>x.email===ctx.email && x.role==='staff');
  if(!u) return `<div class="empty">Staff account not found.<br><button class="btn btn-ghost" style="margin-top:10px;" onclick="go('staff-manage-staff')">← Back</button></div>`;
  const isMe = state.user.email===u.email;
  const isActive = u.active!==false;
  const otherActiveCount = DB.users.filter(x=>x.role==='staff' && x.active!==false && x.email!==u.email).length;
  const cannotDeactivate = isMe || (isActive && otherActiveCount===0);
  return `
    <div class="page-head"><div><h1>${esc(u.fullName)}</h1><div class="page-sub">${esc(u.email)}</div></div>
    <button class="btn btn-ghost" onclick="go('staff-manage-staff')">← Back</button></div>
    <div class="card" style="max-width:520px;">
      <div id="staff-acct-alert"></div>
      <form onsubmit="submitStaffAccountUpdate(event,'${u.email}')">
        <div class="field"><label>Full name</label><input type="text" name="fullName" value="${esc(u.fullName)}" required></div>
        <div class="field"><label>Email address</label><input type="email" name="email" value="${esc(u.email)}" required></div>
        <div class="field"><label>Reset password <span class="hint" style="display:inline;">(leave blank to keep current)</span></label><input type="password" name="password" placeholder="At least 8 characters" minlength="8"></div>
        <button class="btn btn-primary" type="submit">Save account changes</button>
      </form>
      <div class="trail"><div class="dot"></div><div class="dash"></div></div>
      <div class="field" style="margin-bottom:8px;">
        <label>Account status</label>
        <div><span class="chip ${isActive?'chip-success':'chip-danger'}">${isActive?'Active':'Deactivated'}</span></div>
      </div>
      ${isActive
        ? `<button class="btn btn-danger" ${cannotDeactivate?'disabled':''} onclick="confirmDeactivateStaff('${u.email}')">Deactivate</button>`
        : `<button class="btn btn-primary" onclick="confirmDeactivateStaff('${u.email}')">Reactivate</button>`}
      ${isMe? `<p class="hint" style="margin-top:8px;">You cannot deactivate the account you are currently logged in as.</p>`
        : (isActive && otherActiveCount===0)? `<p class="hint" style="margin-top:8px;">This is the only other active staff account — at least one must remain besides you.</p>` : ''}
    </div>`;
}
function submitStaffAccountUpdate(e, originalEmail){
  e.preventDefault();
  const f = e.target;
  const alertBox = document.getElementById('staff-acct-alert');
  const fullName = f.fullName.value.trim();
  const newEmail = f.email.value.trim();
  const password = f.password.value;

  if(!fullName || !newEmail){
    alertBox.innerHTML = `<div class="alert alert-error">E3: Required Fields Missing — please complete all mandatory fields.</div>`;
    return;
  }
  if(!isValidEmail(newEmail)){
    alertBox.innerHTML = `<div class="alert alert-error">Invalid email format.</div>`;
    return;
  }
  if(newEmail !== originalEmail && DB.users.find(x=>x.email===newEmail)){
    alertBox.innerHTML = `<div class="alert alert-error">E2: Email already exists.</div>`;
    return;
  }
  if(password && password.length < 8){
    alertBox.innerHTML = `<div class="alert alert-error">Password must contain at least 8 characters.</div>`;
    return;
  }
  const u = DB.users.find(x=>x.email===originalEmail && x.role==='staff');
  u.fullName = fullName;
  if(password) u.password = password;
  if(newEmail !== originalEmail){
    u.email = newEmail;
    if(state.user.email===originalEmail){ state.user = u; saveSession(u.email); }
  }
  saveDB();
  toast('Staff account updated for ' + fullName + '.', 'success');
  go('staff-manage-staff');
}
function confirmDeactivateStaff(email){
  const u = DB.users.find(x=>x.email===email && x.role==='staff');
  if(!u) return;
  if(state.user.email===email){ toast('You cannot deactivate the account you are currently logged in as.', 'error'); return; }
  const isActive = u.active!==false;
  if(isActive){
    const otherActiveCount = DB.users.filter(x=>x.role==='staff' && x.active!==false && x.email!==email).length;
    if(otherActiveCount===0){ toast('At least one other staff account must stay active.', 'error'); return; }
    openModal('Deactivate this staff account?',
      `<p style="font-size:13.5px; color:var(--ink-soft);">${esc(u.fullName)} will no longer be able to log in until this account is reactivated. Their existing records are kept.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-danger" onclick="setStaffActive('${email}', false)">Deactivate</button>`);
  } else {
    openModal('Reactivate this staff account?',
      `<p style="font-size:13.5px; color:var(--ink-soft);">${esc(u.fullName)} will be able to log in again immediately.</p>`,
      `<button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="setStaffActive('${email}', true)">Reactivate</button>`);
  }
}
function setStaffActive(email, active){
  const u = DB.users.find(x=>x.email===email && x.role==='staff');
  if(!u) return;
  u.active = active;
  saveDB();
  closeModal();
  go('staff-edit-staff', {email});
  openModal(
    active ? 'Account reactivated' : 'Account deactivated',
    `<p style="font-size:13.5px; color:var(--ink-soft);">${esc(u.fullName)}'s staff account has been ${active?'reactivated':'deactivated successfully'}.${active?'':' They will not be able to log in until this is reversed.'}</p>`,
    `<button class="btn btn-primary" onclick="closeModal()">OK</button>`
  );
}

/* ============================================================
   STAFF — Use Case 9: View Dashboard (admin duties, performed by staff)
   ============================================================ */
function renderAdminDashboard(){
  const totalBookings = DB.bookings.length;
  const confirmed = DB.bookings.filter(b=>b.status==='Confirmed').length;
  const pending = DB.bookings.filter(b=>b.status==='Pending').length;
  const cancelled = DB.bookings.filter(b=>b.status==='Cancelled').length;
  const revenue = DB.payments.filter(p=>p.status==='Success').reduce((s,p)=>s+p.amount,0);
  const occupied = DB.campsites.filter(c=> DB.bookings.some(b=>b.campsiteId===c.id && b.status!=='Cancelled')).length;

  return `
    <div class="page-head"><div><div class="page-eyebrow">Use Case 9</div><h1>Dashboard</h1><div class="page-sub">Monitor bookings, payments, customers and campsite occupancy at a glance.</div></div></div>
    <div class="grid grid-4">
      <div class="stat-card"><div class="stat-label">Total bookings</div><div class="stat-value">${totalBookings}</div><div class="stat-note">${confirmed} confirmed · ${pending} pending · ${cancelled} cancelled</div></div>
      <div class="stat-card"><div class="stat-label">Revenue collected</div><div class="stat-value">${money(revenue)}</div><div class="stat-note">${DB.payments.length} successful payment(s)</div></div>
      <div class="stat-card"><div class="stat-label">Campsite occupancy</div><div class="stat-value">${occupied}/${DB.campsites.length}</div><div class="stat-note">plots currently booked</div></div>
      <div class="stat-card"><div class="stat-label">Registered customers</div><div class="stat-value">${DB.users.filter(u=>u.role==='customer').length}</div><div class="stat-note">accounts on file</div></div>
    </div>

    <div class="trail"><div class="dot"></div><div class="dash"></div><div class="label">Recent booking activity</div><div class="dash"></div></div>
    <div class="card">
      <table><thead><tr><th>Reference</th><th>Customer</th><th>Plot</th><th>Total</th><th>Status</th><th>Payment</th></tr></thead>
      <tbody>
      ${DB.bookings.slice().reverse().map(b=>{
        const c = byId(DB.campsites,b.campsiteId);
        return `<tr><td>${b.refNum}</td><td>${esc(b.customerName)}</td><td>${esc(c.name)}</td><td>${money(b.totalCost)}</td>
        <td><span class="chip ${b.status==='Confirmed'?'chip-success':b.status==='Cancelled'?'chip-danger':'chip-warn'}">${b.status}</span></td>
        <td><span class="chip ${b.paymentStatus==='Paid'?'chip-success':'chip-warn'}">${b.paymentStatus}</span></td></tr>`;
      }).join('')}
      </tbody></table>
    </div>`;
}

/* ============================================================
   STAFF — Use Case 8: Generate Reports (admin duties, performed by staff)
   ============================================================ */
function monthKey(dateStr){ return dateStr ? dateStr.slice(0,7) : ''; }
function monthLabel(ym){
  if(!ym) return '';
  const names=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const [y,m] = ym.split('-');
  return names[parseInt(m,10)-1] + ' ' + y;
}
function renderAdminReports(){
  const type = state.ctx.reportType || '';
  const month = state.ctx.reportMonth || '';
  let body = '';

  if(type==='booking'){
    let rows = DB.bookings;
    if(month) rows = rows.filter(b=> monthKey(b.checkIn)===month);
    if(rows.length===0){
      body = `<div class="empty">E1: No records found${month? ' for '+monthLabel(month) : ''}.</div>`;
    } else {
      body = `<div class="card"><table><thead><tr><th>Ref</th><th>Customer</th><th>Plot</th><th>Dates</th><th>Visitors</th><th>Status</th></tr></thead><tbody>
      ${rows.map(b=>{ const c=byId(DB.campsites,b.campsiteId); return `<tr><td>${b.refNum}</td><td>${esc(b.customerName)}</td><td>${esc(c.name)}</td><td>${fmtDate(b.checkIn)}→${fmtDate(b.checkOut)}</td><td>${b.numVisitors}</td><td>${b.status}</td></tr>`; }).join('')}
      </tbody></table></div>`;
    }
  } else if(type==='financial'){
    let rows = DB.payments;
    if(month) rows = rows.filter(p=> monthKey(p.date)===month);
    if(rows.length===0){
      body = `<div class="empty">E1: No records found${month? ' for '+monthLabel(month) : ''}.</div>`;
    } else {
      const total = rows.reduce((s,p)=>s+p.amount,0);
      body = `<div class="card">
        <div class="stat-card" style="margin-bottom:16px; max-width:260px;"><div class="stat-label">Total revenue${month? ' — '+monthLabel(month) : ''}</div><div class="stat-value">${money(total)}</div></div>
        <table><thead><tr><th>Payment ID</th><th>Booking</th><th>Method</th><th>Amount</th><th>Date</th></tr></thead><tbody>
        ${rows.map(p=>`<tr><td>${p.id}</td><td>${p.bookingId}</td><td>${p.method}</td><td>${money(p.amount)}</td><td>${fmtDate(p.date)}</td></tr>`).join('')}
        </tbody></table></div>`;
    }
  }

  // build the list of months available for the chosen report type
  const monthSource = type==='financial' ? DB.payments.map(p=>p.date) : DB.bookings.map(b=>b.checkIn);
  const months = [...new Set(monthSource.map(monthKey))].filter(Boolean).sort();

  return `
    <div class="page-head"><div><div class="page-eyebrow">Use Case 8</div><h1>Generate Reports</h1><div class="page-sub">Choose a report type, then narrow it down to a specific month.</div></div></div>
    <div class="card" style="max-width:500px; margin-bottom:18px;">
      <div class="field"><label>Report type</label>
        <select onchange="state.ctx.reportType=this.value; state.ctx.reportMonth=''; render();">
          <option value="">Select a report…</option>
          <option value="booking" ${type==='booking'?'selected':''}>Booking report</option>
          <option value="financial" ${type==='financial'?'selected':''}>Financial transaction report</option>
        </select>
      </div>
      ${type ? `
      <div class="field">
        <label>Month</label>
        <select onchange="state.ctx.reportMonth=this.value; render();">
          <option value="">All months</option>
          ${months.map(m=>`<option value="${m}" ${month===m?'selected':''}>${monthLabel(m)}</option>`).join('')}
        </select>
        ${months.length===0 ? `<div class="hint">No dated records yet for this report type.</div>` : ''}
      </div>` : ''}
    </div>
    ${body}`;
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(!state.user){
    app.innerHTML = (state.page==='landing') ? renderLanding() : renderLogin();
    return;
  }

  let inner = '';
  switch(state.page){
    case 'customer-home': inner = renderCustomerHome(); break;
    case 'campsite-list': inner = renderCampsiteList(); break;
    case 'campsite-details': inner = renderCampsiteDetails(state.ctx); break;
    case 'check-availability': inner = renderCheckAvailability(); break;
    case 'booking-form': inner = renderBookingForm(state.ctx); break;
    case 'tent-rental-form': inner = renderTentRentalForm(state.ctx); break;
    case 'booking-confirmation': inner = renderBookingConfirmation(state.ctx); break;
    case 'my-bookings': inner = renderMyBookings(); break;
    case 'booking-view': inner = renderBookingView(state.ctx); break;
    case 'payment': inner = renderPayment(state.ctx); break;
    case 'payment-receipt': inner = renderPaymentReceipt(state.ctx); break;
    case 'payment-history': inner = renderPaymentHistory(); break;

    case 'staff-bookings': inner = renderStaffBookings(); break;
    case 'staff-booking-view': inner = renderStaffBookingView(state.ctx); break;
    case 'staff-booking-edit': inner = renderStaffBookingEdit(state.ctx); break;
    case 'staff-booking-new': inner = renderStaffBookingNew(); break;
    case 'staff-customers': inner = renderStaffCustomers(); break;
    case 'staff-customer-detail': inner = renderStaffCustomerDetail(state.ctx); break;
    case 'staff-campsite-availability': inner = renderStaffCampsiteAvailability(); break;
    case 'staff-campsite-closures': inner = renderStaffCampsiteClosures(state.ctx); break;
    case 'staff-campsite-view': inner = renderStaffCampsiteView(state.ctx); break;
    case 'staff-tent-availability': inner = renderStaffTentAvailability(); break;
    case 'staff-activity-availability': inner = renderStaffActivityAvailability(); break;
    case 'staff-manage-staff': inner = renderStaffManageStaff(); break;
    case 'staff-edit-staff': inner = renderStaffEditStaff(state.ctx); break;

    case 'admin-dashboard': inner = renderAdminDashboard(); break;
    case 'admin-reports': inner = renderAdminReports(); break;

    default: inner = renderCustomerHome();
  }
  app.innerHTML = renderShell(inner);
  if(state.page==='booking-form') updateBookingSummary();
  if(state.page==='tent-rental-form') updateTentRentalSummary();
  if(state.page==='staff-booking-new') updateStaffBookingSummary();
  if(state.page==='staff-booking-edit') updateStaffEditSummary();
}

/* ---------------------------- Boot ---------------------------- */
async function init(){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div style="text-align:center;">
        <div style="font-size:34px; margin-bottom:10px; display:inline-block; animation:floatY 1.6s ease-in-out infinite;">🏕</div>
        <div style="font-family:'Fraunces',serif; font-weight:700; color:var(--forest); font-size:17px;">Loading Perong Campsite data…</div>
      </div>
    </div>`;
  const loaded = await loadDB();
  if(!loaded) await saveDB(); // first run on this account/browser — persist the seed data

  // Restore THIS TAB's own login (sessionStorage is per-tab, so this never
  // leaks into or gets overwritten by other open tabs).
  const restoredUser = restoreSession();
  if(restoredUser){
    state.user = restoredUser;
    state.role = restoredUser.role;
    state.page = restoredUser.role==='customer' ? 'customer-home' : 'admin-dashboard';
  }
  render();
}
init();
</script>
